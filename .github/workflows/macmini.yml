name: Mac Mini stock watch

on:
  # Schedule disabled — periodic polling now runs on the Mac Mini via launchd
  # (see ~/Library/LaunchAgents/net.trailhead.macmini-watch.plist).
  # workflow_dispatch is kept so the Slack webhook can still be smoke-tested
  # from the Actions tab without involving the Mac Mini.
  workflow_dispatch:
    inputs:
      test_ping:
        description: "Send a Slack test ping and exit (no real check)"
        type: boolean
        default: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: macmini-watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run check
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_MENTION_USER_IDS: ${{ secrets.SLACK_MENTION_USER_IDS }}
          TEST_PING: ${{ inputs.test_ping == true && '1' || '0' }}
          PRICE_CAP: "600"
        run: python check.py
